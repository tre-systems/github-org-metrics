[project]
name = "github-org-metrics"
version = "1.0.0"
description = "Fetch and analyse GitHub organization metrics, including DORA metrics"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Rob Gilks" }]
keywords = ["github", "metrics", "dora", "devops", "engineering-analytics"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = ["requests>=2.31.0", "rich>=13.7.0"]

[project.urls]
Homepage = "https://github.com/tre-systems/github-org-metrics"
Issues = "https://github.com/tre-systems/github-org-metrics/issues"

[project.scripts]
github-metrics = "github_metrics.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "responses>=0.25",
    "ruff>=0.8.0",
    "types-requests>=2.31",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/github_metrics"]

[tool.ruff]
line-length = 90
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "A",   # shadowed builtins
    "ANN", # missing annotations
    "ARG", # unused arguments
    "B",   # bugbear
    "C4",  # comprehensions
    "DTZ", # naive datetimes
    "E",   # pycodestyle
    "EM",  # exception messages
    "F",   # pyflakes
    "I",   # import order
    "N",   # naming
    "PERF",
    "PL",  # pylint
    "PTH", # pathlib
    "RET", # returns
    "RUF",
    "S",   # bandit
    "SIM", # simplify
    "T20", # no stray prints
    "TRY", # exception hygiene
    "UP",  # pyupgrade
    "W",
]
ignore = [
    "ANN401",  # Any is the honest type for decoded JSON
    "PLR0913", # metric functions legitimately take several inputs
    "TRY003",  # short messages inline are clearer than exception subclasses
    "TRY400",  # CLI errors are reported to users, not dumped as tracebacks
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "EM", "PLR2004", "S101"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/github_metrics"]
branch = true

[tool.coverage.report]
fail_under = 90
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]
